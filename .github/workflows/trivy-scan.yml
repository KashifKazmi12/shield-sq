# Reference workflow: run Trivy against the built image and forward results to
# SQSecure. Assumes GitHub Actions — swap for the equivalent steps if the actual
# CI platform differs (see DECISIONS.md).
name: Trivy scan -> SQSecure

on:
  push:
    branches: [main]
  pull_request:

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sample-app:${{ github.sha }} .

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: sample-app:${{ github.sha }}
          format: json
          output: trivy-results.json
          exit-code: 0 # SQSecure only reports; pipeline-blocking is Trivy's own --exit-code / --severity flags

      - name: Forward results to SQSecure
        env:
          SQSECURE_URL: ${{ secrets.SQSECURE_INGEST_URL }} # e.g. https://sqsecure.example.com
          SQSECURE_TOKEN: ${{ secrets.SQSECURE_INGEST_TOKEN }} # per-project token, created in SQSecure Settings
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg commit "${{ github.sha }}" \
            --arg pipeline "${{ github.run_id }}" \
            --slurpfile results trivy-results.json \
            '{meta: {repo: $repo, branch: $branch, commitSha: $commit, pipelineId: $pipeline}, results: $results[0]}' \
            > sqsecure-payload.json

          curl -sS -f -X POST "$SQSECURE_URL/api/ingest/trivy" \
            -H "Authorization: Bearer $SQSECURE_TOKEN" \
            -H "Content-Type: application/json" \
            --data @sqsecure-payload.json
