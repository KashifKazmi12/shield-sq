# Reference Helm values for falcosidekick (https://github.com/falcosecurity/falcosidekick),
# forwarding Falco runtime alerts to SQSecure's ingest endpoint as a generic
# webhook (customConfig) target. Merge into your falco/falcosidekick Helm
# release values — this file is not applied automatically.
#
# Install alongside the falco chart, e.g.:
#   helm upgrade --install falco falcosecurity/falco \
#     --set falcosidekick.enabled=true \
#     -f deploy/falcosidekick-values.example.yaml

falcosidekick:
  enabled: true
  config:
    customfields: "cluster:my-cluster" # tag alerts with cluster name if running multiple

    # SQSecure has no dedicated Falcosidekick output type, so we use the generic
    # "webhook" output, which POSTs the raw Falco alert JSON as-is — matching
    # what src/lib/falco.ts expects (rule, priority, output, output_fields).
    webhook:
      address: "https://sqsecure.example.com/api/ingest/falco"
      customHeaders: "Authorization:Bearer REPLACE_WITH_SQSECURE_INGEST_TOKEN"
      # mintimefailure/maxretry: use falcosidekick's own defaults; SQSecure's
      # per-alert dedupeKey makes retried deliveries safe to replay.
